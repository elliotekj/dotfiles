# Gruvbox Material Soft Dark palette from sainnhe/gruvbox-material.

[mgr]
cwd = { fg = "#89b482" }
find_keyword = { fg = "#d8a657", bold = true, italic = true, underline = true }
find_position = { fg = "#d3869b", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#a9b665", bg = "#a9b665" }
marker_cut = { fg = "#ea6962", bg = "#ea6962" }
marker_marked = { fg = "#89b482", bg = "#89b482" }
marker_selected = { fg = "#d8a657", bg = "#d8a657" }
count_copied = { fg = "#32302f", bg = "#a9b665" }
count_cut = { fg = "#32302f", bg = "#ea6962" }
count_selected = { fg = "#32302f", bg = "#d8a657" }
border_symbol = "│"
border_style = { fg = "#7c6f64" }

[tabs]
active = { fg = "#32302f", bg = "#7daea3", bold = true }
inactive = { fg = "#7daea3", bg = "#3c3836" }

[mode]
normal_main = { fg = "#32302f", bg = "#7daea3", bold = true }
normal_alt = { fg = "#7daea3", bg = "#3c3836" }
select_main = { fg = "#32302f", bg = "#89b482", bold = true }
select_alt = { fg = "#89b482", bg = "#3c3836" }
unset_main = { fg = "#32302f", bg = "#ea6962", bold = true }
unset_alt = { fg = "#ea6962", bg = "#3c3836" }

[status]
perm_sep = { fg = "#7c6f64" }
perm_type = { fg = "#7daea3" }
perm_read = { fg = "#d8a657" }
perm_write = { fg = "#ea6962" }
perm_exec = { fg = "#a9b665" }
progress_label = { fg = "#ddc7a1", bold = true }
progress_normal = { fg = "#a9b665", bg = "#504945" }
progress_error = { fg = "#d8a657", bg = "#ea6962" }

[pick]
border = { fg = "#7daea3" }
active = { fg = "#d3869b", bold = true }

[input]
border = { fg = "#7daea3" }
selected = { reversed = true }

[cmp]
border = { fg = "#7daea3" }

[tasks]
border = { fg = "#7daea3" }
hovered = { fg = "#d3869b", bold = true }

[which]
mask = { bg = "#3c3836" }
cand = { fg = "#89b482" }
rest = { fg = "#a89984" }
desc = { fg = "#d3869b" }
separator = "  "
separator_style = { fg = "#7c6f64" }

[help]
on = { fg = "#89b482" }
run = { fg = "#d3869b" }
hovered = { reversed = true, bold = true }
footer = { fg = "#3c3836", bg = "#d4be98" }

[spot]
border = { fg = "#7daea3" }
title = { fg = "#7daea3" }
tbl_col = { fg = "#89b482" }
tbl_cell = { fg = "#d3869b", bg = "#504945" }

[notify]
title_info = { fg = "#a9b665" }
title_warn = { fg = "#d8a657" }
title_error = { fg = "#ea6962" }

[filetype]
rules = [
  { mime = "image/*", fg = "#89b482" },
  { mime = "{audio,video}/*", fg = "#d8a657" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d3869b" },
  { mime = "application/{pdf,doc,rtf}", fg = "#a9b665" },
  { mime = "vfs/{absent,stale}", fg = "#a89984" },
  { url = "*", fg = "#d4be98" },
  { url = "*/", fg = "#7daea3" },
]
